services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: phygital_db
    ports:
      # Bind hanya ke localhost (127.0.0.1) agar tidak terekspos ke internet publik di VPS/server
      - "127.0.0.1:5435:5432"
    volumes:
      - phygital_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      # Bind hanya ke localhost agar aman dari akses luar
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://admin:password123@postgres:5432/phygital_db?schema=public
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:3001
    depends_on:
      - api

volumes:
  phygital_pg_data:
  redis_data:
